[package]
name = "statlet-runtime-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSControl", "NSStatusBarButton", "NSFont", "NSAttributedString", "NSText", "NSColor", "NSImage", "NSStringDrawing", "NSGraphics", "NSGraphicsContext", "NSCell"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSDictionary", "NSAttributedString"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tao = "0.34"
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
strip = true

[package]
name = "statlet"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Tiny macOS system stats, stacked"
license = "Apache-2.0"
repository = "https://github.com/hayashirafael/statlet"

[dependencies]
block2 = "0.6.2"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityProtocols", "NSApplication", "NSWindow", "NSView", "NSControl", "NSStatusBarButton", "NSFont", "NSFontDescriptor", "NSFontManager", "NSAttributedString", "NSText", "NSTextField", "NSSearchField", "NSButton", "NSPopUpButton", "NSSegmentedControl", "NSSlider", "NSStepper", "NSStackView", "NSMenu", "NSResponder", "NSColor", "NSColorSpace", "NSColorWell", "NSImage", "NSImageView", "NSStringDrawing", "NSGraphics", "NSGraphicsContext", "NSCell", "NSParagraphStyle", "NSAlert", "NSAppearance", "NSScrollView", "NSClipView", "NSTableView", "NSTableColumn", "NSUserInterfaceItemIdentification", "NSLayoutConstraint", "NSLayoutAnchor", "NSEvent", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSPanel"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSAttributedString", "NSBundle", "NSURL", "NSError", "NSValue", "NSFileManager", "NSDate", "NSDateFormatter", "NSFormatter", "NSNotification", "NSKeyValueObserving"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tao = { version = "0.34", default-features = false }
tray-icon = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

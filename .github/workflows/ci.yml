name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 arm64 / target macOS 14 / Rust 1.89
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - name: Validate shell scripts
        run: bash -n scripts/*.sh tests/package_contract.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Verify third-party licenses
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cp packaging/THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          scripts/generate-third-party-licenses.sh
          cmp "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html" packaging/THIRD_PARTY_LICENSES.html
      - name: Verify production bundle contract
        run: bash tests/package_contract.sh
